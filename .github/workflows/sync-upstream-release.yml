name: Sync upstream release

on:
  schedule:
    # GitHub cron uses UTC. This runs daily at 05:17 Asia/Shanghai.
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional upstream release tag (for example, v0.7.2)"
        required: false
        type: string

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPOSITORY: multica-ai/multica
  TARGET_BRANCH: selfhost
  SYNC_BRANCH: automation/sync-upstream-release

jobs:
  sync:
    name: Open upstream release PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

      - name: Resolve the upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="${REQUESTED_TAG}"
          if [[ -z "${tag}" ]]; then
            tag="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi

          git fetch --force upstream "refs/tags/${tag}:refs/tags/${tag}"
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Selected upstream release ${tag}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check whether the release is already integrated
        id: integrated
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --force origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          if git merge-base --is-ancestor \
            "refs/tags/${RELEASE_TAG}^{commit}" \
            "refs/remotes/origin/${TARGET_BRANCH}"; then
            echo "value=true" >> "${GITHUB_OUTPUT}"
            echo "${RELEASE_TAG} is already integrated into ${TARGET_BRANCH}." \
              >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "value=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Merge the release into a candidate branch
        if: steps.integrated.outputs.value != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git switch --force-create "${SYNC_BRANCH}" \
            "refs/remotes/origin/${TARGET_BRANCH}"

          if ! git merge --no-ff --no-edit \
            "refs/tags/${RELEASE_TAG}^{commit}" \
            -m "chore(selfhost): sync upstream ${RELEASE_TAG}"; then
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            git merge --abort
            {
              echo "## Upstream merge conflict"
              echo
              echo "Could not merge ${RELEASE_TAG} into ${TARGET_BRANCH}."
              echo
              echo '```text'
              echo "${conflicts}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          git push --force origin \
            "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Create or update the sync pull request
        if: steps.integrated.outputs.value != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          title="chore(selfhost): sync upstream ${RELEASE_TAG}"
          body_file="$(mktemp)"
          cat > "${body_file}" <<EOF
          This automated PR merges the official Multica release **${RELEASE_TAG}** into the \`${TARGET_BRANCH}\` branch.

          - Source: https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${RELEASE_TAG}
          - Target: \`${TARGET_BRANCH}\`
          - Generated by: \`sync-upstream-release.yml\`

          Merge this PR with **Create a merge commit** so future upstream syncs retain the official release ancestry. Do not squash it.
          EOF

          pr_number="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${TARGET_BRANCH}" \
            --head "${SYNC_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "${pr_number}" ]]; then
            gh pr edit "${pr_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body-file "${body_file}"
            echo "Updated PR #${pr_number}." >> "${GITHUB_STEP_SUMMARY}"
          else
            pr_url="$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "${title}" \
              --body-file "${body_file}")"
            echo "Created ${pr_url}." >> "${GITHUB_STEP_SUMMARY}"
          fi
